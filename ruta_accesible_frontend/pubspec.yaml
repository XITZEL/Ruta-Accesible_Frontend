name: ruta_accesible_frontend
description: "App de movilidad accesible"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # Navegación y Mapas
  google_maps_flutter: ^2.9.0
  flutter_polyline_points: ^2.0.0
  geolocator: ^13.0.1
  
  # Comunicación con el Backend
  http: ^1.2.0
  
  # Voz y Accesibilidad
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  flutter_dotenv: ^5.1.0
  image_picker: ^1.0.0
  
  # Iconos y Diseño
  cupertino_icons: ^1.0.6
  permission_handler: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env